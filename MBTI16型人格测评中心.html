    <style>

            border-radius: 26px;
            border: 1px solid #f5ece8;
            box-shadow: 0 16px 34px -24px rgba(89, 72, 120, 0.24);
        }
        .clay-btn {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, filter 0.2s ease;
            box-shadow: 0 14px 26px -12px rgba(124, 58, 237, 0.35);
        }
        .clay-btn:hover { transform: translateY(-3px); filter: saturate(1.05); }
        .clay-btn:active { transform: translateY(1px); }
        .btn:focus-visible, .clay-btn:focus-visible, .tap:focus-visible {
            outline: 3px solid #ffc9a8;
            outline-offset: 3px;
        }
        .tap { cursor: pointer; }
        .sticker { transform: rotate(-2deg); }
        .sticker-r { transform: rotate(2deg); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeUp 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) both; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        .floaty { animation: floaty 5s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(0.94); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop { animation: pop 0.35s cubic-bezier(0.2, 1, 0.4, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in, .floaty, .pop { animation: none !important; }
            .clay-btn:hover { transform: none; }
        }

        .mascot-frame {
            border-radius: 22px;
            background: #fff;
            border: 1px solid #f3ecef;
            overflow: hidden;
            transition: transform 0.28s ease, box-shadow 0.28s ease;
        }

            background: linear-gradient(135deg, #fff4ee 0%, #fff0f3 55%, #fef7ea 100%);
            border: 1px solid #ffdfd2;
            border-radius: 26px;

        .advice-dot {

            width: 8px; height: 8px;
            margin-top: 9px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffbf86, #f28d86);

            align-items: center;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.4;

        }

        /* ===================== 小图标 ===================== */
        function Icon({ name, size = 18, color = "currentColor" }) {

                crown: <path d="M3 8l4 4 5-6 5 6 4-4 2 10H1z" />,
                spark: <path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" />,
                home: <path d="M3 11l9-7 9 7M6 10v10h12V10" />,
                back: <path d="M15 5l-7 7 7 7" />,
                refresh: <path d="M4 12a8 8 0 1 1 3 6M4 6v6h6" />,
                heart: <path d="M12 20s-7-4.6-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.6C19 15.4 12 20 12 20z" />
            };
            return (
                <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" aria-hidden="true">
                    {paths[name] || null}
                </svg>
            );
        }

        /* ===================== 四维条组件 ===================== */
        function DimRow({ dim, scores }) {
            const a = scores[dim.a] || 0;
            const b = scores[dim.b] || 0;
            const total = a + b || 1;
            const pa = Math.round((a / total) * 100);
            const lead = a >= b ? dim.a : dim.b;
            return (
                <div>
                    <div className="flex items-center justify-between text-[12.5px] font-bold text-slate-600 mb-1.5">
                        <span>{dim.labelA} {pa}%</span>
                        <span className="text-slate-400 font-medium">{dim.labelB} {100 - pa}%</span>
                    </div>
                    <div className="dim-bar-wrap">
                        <div style={{ width: pa + "%", background: dim.color, transition: "width .6s ease" }}></div>
                        <div style={{ width: (100 - pa) + "%", background: dim.soft, transition: "width .6s ease" }}></div>
                    </div>
                    <p className="text-[11.5px] text-slate-400 mt-1.5 leading-relaxed">{DIM_READ[lead]}</p>
                </div>
            );
        }

        const DIMS = [
            { a: "E", b: "I", labelA: "外向 E", labelB: "内向 I", color: "#b394ea", soft: "#ece4fb" },
            { a: "S", b: "N", labelA: "感觉 S", labelB: "直觉 N", color: "#7fcaa8", soft: "#e2f5eb" },
            { a: "T", b: "F", labelA: "思考 T", labelB: "情感 F", color: "#8fbcf0", soft: "#e4effc" },
            { a: "J", b: "P", labelA: "判断 J", labelB: "知觉 P", color: "#f0a868", soft: "#ffe9d2" }
        ];

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const isAdmin = urlParams.get('admin') === 'true';

            const [logs, setLogs] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('mbti_usage_logs');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            const tokenUsedKey = `mbti_used_${token}`;
            const [view, setView] = React.useState(() => {
                if (isAdmin) return 'home';
                if (!token) return 'unauthorized';
                if (localStorage.getItem(`mbti_used_${token}`) === 'true') return 'expired';
                return 'home';
            });

            const [questions, setQuestions] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [resultType, setResultType] = React.useState(null);
            const [scores, setScores] = React.useState(null);
            const [selectedModalType, setSelectedModalType] = React.useState(null);

            const radarChartRef = React.useRef(null);
            const chartInstance = React.useRef(null);
            const timerRef = React.useRef(null);

            const go = (next) => { setView(next); window.scrollTo({ top: 0, behavior: 'smooth' }); };

            const startQuiz = () => {
                if (!isAdmin && localStorage.getItem(tokenUsedKey) === 'true') { go('expired'); return; }
                setQuestions(getRandomTestQuestions());
                setCurrentIndex(0);
                setAnswers({});
                go('quiz');
            };

            const calculateResult = (finalAnswers) => {
                let counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                Object.values(finalAnswers).forEach(ans => {
                    if (counts[ans.type] !== undefined) counts[ans.type] += ans.score;
                });
                const finalType = (counts.E >= counts.I ? 'E' : 'I') +
                                  (counts.S >= counts.N ? 'S' : 'N') +
                                  (counts.T >= counts.F ? 'T' : 'F') +
                                  (counts.J >= counts.P ? 'J' : 'P');

                setResultType(finalType);
                setScores(counts);

                if (!isAdmin && token) {
                    localStorage.setItem(tokenUsedKey, 'true');
                    const newLog = { token: token, result: finalType, time: new Date().toLocaleString() };
                    const updatedLogs = [newLog, ...logs];
                    setLogs(updatedLogs);
                    localStorage.setItem('mbti_usage_logs', JSON.stringify(updatedLogs));
                }
                go('result');
            };

            const handleSelectOption = (questionId, type, score) => {
                const next = { ...answers, [questionId]: { type, score } };
                setAnswers(next);
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    if (currentIndex < questions.length - 1) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        calculateResult(next);
                    }
                }, 230);
            };

            const goBackQuestion = () => {
                if (timerRef.current) clearTimeout(timerRef.current);
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            React.useEffect(() => {
                if (view === 'result' && scores && resultType && radarChartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const theme = THEME[mbtiData[resultType].group];
                    const ctx = radarChartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['外向 E', '直觉 N', '情感 F', '知觉 P', '内向 I', '感觉 S', '思考 T', '判断 J'],
                            datasets: [{
                                label: '八维偏好分布',
                                data: [scores.E || 0, scores.N || 0, scores.F || 0, scores.P || 0, scores.I || 0, scores.S || 0, scores.T || 0, scores.J || 0],
                                backgroundColor: theme.bg2,
                                borderColor: theme.accent,
                                pointBackgroundColor: theme.deep,
                                pointBorderColor: '#fff',
                                pointRadius: 4,
                                borderWidth: 2.5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 900 },
                            scales: {
                                r: {
                                    angleLines: { color: 'rgba(203, 213, 225, 0.45)' },
                                    grid: { color: 'rgba(203, 213, 225, 0.45)' },
                                    pointLabels: { font: { size: 12, weight: '700', family: 'Quicksand, Noto Sans SC' }, color: '#6b6478' },
                                    ticks: { display: false, max: 16, stepSize: 4 }
                                }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [view, scores, resultType]);

            React.useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

            /* ---------- 未授权 / 已失效 ---------- */
            if (view === 'unauthorized' || view === 'expired') {

                                <button onClick={() => go('encyclopedia')} className={`px-4 py-2 rounded-xl text-[13px] font-bold transition ${view === 'encyclopedia' ? 'bg-slate-800 text-white' : 'bg-white/80 text-slate-600 hover:bg-white'}`}>人格图鉴</button>

                                                    {group.types.map(type => (
                                                        <button key={type} onClick={() => setSelectedModalType(type)} className="tap text-center bg-transparent border-0 p-0">
                                                            <div className="mascot-frame p-1.5">
                                                                <Mascot type={type} />
                                                            </div>
                                                            <span className="block text-[10.5px] font-bold text-slate-500 mt-1.5">{type}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="quote-card p-7 sm:p-9 text-center">
                                    <p className="text-[17px] sm:text-[20px] font-bold text-[#8c5b52] leading-relaxed max-w-3xl mx-auto">
                                        「人格不是一张判决书，而是一份说明书——它帮你解释自己为什么会这样，也提醒你，你还可以成为别的样子。」
                                    </p>
                                    <p className="text-[12px] text-[#b78d83] mt-3 font-semibold">写给每一个正在了解自己的人</p>
                                </section>
                            </div>
                        )}

                        {/* ===== 后台 ===== */}
                        {view === 'admin' && isAdmin && (
                            <div className="space-y-5 animate-fade-in pb-10">
                                <div className="clay-card p-6 sm:p-8" style={{ background: "linear-gradient(135deg,#4a4358,#6b5a86)" }}>
                                    <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                        <Icon name="crown" size={22} color="#ffd79a" />
                                        管理员控制台
                                    </h2>
                                    <p className="text-white/70 text-[13px] mt-1.5">记录所有外发链接的使用情况。数据存在本机浏览器里，换设备看不到。</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div className="clay-card p-6">
                                        <div className="text-[11.5px] font-bold text-slate-400 tracking-wide mb-1">完成测评次数</div>
                                        <div className="text-4xl font-black text-[#e07a6f]">{logs.length}<span className="text-sm font-medium text-slate-400 ml-2">次</span></div>
                                    </div>
                                    <div className="clay-card p-6">
                                        <div className="text-[11.5px] font-bold text-slate-400 tracking-wide mb-2">当前权限</div>
                                        <div className="text-[15px] font-bold text-[#2f876a] flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-[#4fb98c] inline-block"></span>
                                            不限次数测评 (?admin=true)
                                        </div>
                                    </div>
                                </div>
                                <div className="clay-card p-6 sm:p-8">
                                    <h3 className="text-[17px] font-black text-slate-800 mb-4">使用记录</h3>
                                    {logs.length === 0 ? (
                                        <div className="text-center py-14 text-slate-400 text-[13px]">还没有人完成过测评。</div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left" style={{ tableLayout: "fixed" }}>
                                                <colgroup>
                                                    <col style={{ width: "12%" }} /><col style={{ width: "40%" }} /><col style={{ width: "20%" }} /><col style={{ width: "28%" }} />
                                                </colgroup>
                                                <thead>
                                                    <tr className="text-[11.5px] text-slate-400 border-b border-[#f1ecf3]">
                                                        <th className="py-2.5 pr-3 font-bold">序号</th>
                                                        <th className="py-2.5 pr-3 font-bold">访客 Token</th>
                                                        <th className="py-2.5 pr-3 font-bold">结果</th>
                                                        <th className="py-2.5 font-bold">完成时间</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-[13px]">
                                                    {logs.map((log, index) => (
                                                        <tr key={index} className="border-b border-[#f7f3f9]">
                                                            <td className="py-3 pr-3 text-slate-400">#{logs.length - index}</td>
                                                            <td className="py-3 pr-3 font-bold text-slate-600 truncate">{log.token}</td>
                                                            <td className="py-3 pr-3"><span className="chip bg-[#f4edff] text-[#6b4fa3]">{log.result}</span></td>
                                                            <td className="py-3 text-slate-400 text-[12px]">{log.time}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ===== 答题 ===== */}
                        {view === 'quiz' && questions.length > 0 && (
                            <div className="max-w-2xl mx-auto animate-fade-in">
                                <div className="clay-card p-6 sm:p-9">
                                    <div className="flex justify-between items-center mb-3">
                                        <button onClick={goBackQuestion} disabled={currentIndex === 0} className={`flex items-center gap-1 text-[12.5px] font-bold px-3 py-1.5 rounded-xl transition ${currentIndex === 0 ? 'text-slate-300' : 'text-slate-500 hover:bg-slate-50'}`}>
                                            <Icon name="back" size={14} /> 上一题
                                        </button>
                                        <span className="text-[12px] font-bold text-[#e07a6f]">{currentIndex + 1} / {questions.length}</span>
                                    </div>
                                    <div className="progress-track mb-8">
                                        <div className="progress-bar" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}></div>
                                    </div>
                                    <h2 className="text-[20px] sm:text-[24px] font-black text-slate-800 leading-snug mb-7">{questions[currentIndex].text}</h2>
                                    <div className="space-y-3">
                                        {questions[currentIndex].options.map((opt, idx) => {
                                            const cur = answers[questions[currentIndex].id];
                                            const isSelected = cur && cur.type === opt.type && cur.score === opt.score;
                                            return (
                                                <div key={idx}
                                                    role="button"
                                                    tabIndex={0}
                                                    onClick={() => handleSelectOption(questions[currentIndex].id, opt.type, opt.score)}
                                                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') handleSelectOption(questions[currentIndex].id, opt.type, opt.score); }}
                                                    className={`option-card tap p-4 sm:p-5 ${isSelected ? 'selected' : ''}`}>
                                                    <div className="flex items-start gap-3">
                                                        <div className="w-5 h-5 mt-0.5 rounded-full border-2 flex items-center justify-center flex-shrink-0" style={{ borderColor: isSelected ? '#ef7d7a' : '#e2dbe8', background: isSelected ? '#ef7d7a' : '#fff' }}>
                                                            {isSelected && <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#fff" strokeWidth="3"><path d="M5 13l4 4 10-10" /></svg>}
                                                        </div>
                                                        <span className="text-[14.5px] font-medium text-slate-700 leading-relaxed">{opt.text}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <p className="text-center text-[11.5px] text-slate-400 mt-5">点选后会轻轻跳到下一题，选错了也能回上一题改</p>
                                </div>
                            </div>
                        )}

                        {/* ===== 结果 ===== */}
                        {view === 'result' && resultType && scores && (
                            <div className="space-y-5 animate-fade-in pb-10">
                                {/* 头部 */}
                                <section className="clay-card p-6 sm:p-9">
                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                                        <div className="md:col-span-8 order-2 md:order-1">
                                            <div className="flex flex-wrap items-center gap-2 mb-2">
                                                <span className={`chip ${GROUPS.find(g => g.key === mbtiData[resultType].group).tint}`}>{mbtiData[resultType].groupName} · {mbtiData[resultType].group}</span>
                                                <span className="text-[11.5px] text-slate-400 font-semibold">四字母代号 {resultType}</span>
                                            </div>
                                            <h1 className="text-[32px] sm:text-[40px] font-black text-slate-800 leading-tight">
                                                {mbtiData[resultType].name}
                                                <span className="text-[15px] font-bold text-slate-400 ml-2 align-middle">{resultType}</span>
                                            </h1>
                                            <p className="text-[15px] font-bold mt-2" style={{ color: "#d4796f" }}>{mbtiData[resultType].slogan}</p>
                                            <p className="text-[13.5px] text-slate-500 mt-3 leading-relaxed max-w-xl">{mbtiData[resultType].summary}</p>
                                            <div className="flex flex-wrap gap-2.5 mt-5">
                                                {isAdmin ? (
                                                    <button onClick={startQuiz} className="px-4 py-2.5 rounded-xl text-[13px] font-bold text-white flex items-center gap-2" style={{ background: "linear-gradient(120deg,#ffa986,#ef7d7a)" }}>
                                                        <Icon name="refresh" size={14} color="#fff" /> 再测一次
                                                    </button>
                                                ) : null}
                                                <button onClick={() => go('encyclopedia')} className="px-4 py-2.5 rounded-xl text-[13px] font-bold text-slate-600 bg-white border border-[#efe8ee] hover:bg-[#fffaf7] transition">看看其他人格</button>
                                                <button onClick={() => go('home')} className="px-4 py-2.5 rounded-xl text-[13px] font-bold text-slate-500 bg-white border border-[#efe8ee] hover:bg-[#fffaf7] transition flex items-center gap-1.5">
                                                    <Icon name="home" size={14} /> 返回首页
                                                </button>
                                            </div>
                                        </div>
                                        <div className="md:col-span-4 order-1 md:order-2">
                                            <div className="w-40 sm:w-48 mx-auto md:mx-0 md:ml-auto floaty">
                                                <Mascot type={resultType} />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* 图表 */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <section className="clay-card p-6 sm:p-7">
                                        <h3 className="text-[15px] font-black text-slate-800 mb-4 flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "#b394ea" }}></span>
                                            八维偏好分布图
                                        </h3>
                                        <div className="relative w-full h-[290px]">
                                            <canvas ref={radarChartRef}></canvas>
                                        </div>
                                        <p className="text-[11.5px] text-slate-400 mt-2 leading-relaxed">越靠近外圈的维度，说明你在这一侧的表现越明显。没有绝对的强弱，只有你更顺手的方式。</p>
                                    </section>
                                    <section className="clay-card p-6 sm:p-7">
                                        <h3 className="text-[15px] font-black text-slate-800 mb-5 flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "#f0a868" }}></span>
                                            四组偏好比例
                                        </h3>
                                        <div className="space-y-5">
                                            {DIMS.map(dim => <DimRow key={dim.a} dim={dim} scores={scores} />)}
                                        </div>
                                    </section>
                                </div>

                                {/* 深度画像 */}
                                <section className="clay-card p-6 sm:p-9">
                                    <h3 className="text-[17px] font-black text-slate-800 mb-1">关于你，比代号更具体的那部分</h3>
                                    <p className="text-[11.5px] text-slate-400 mb-4">这段是根据 {resultType} 的典型特征写的，读的时候不妨留意哪几句最像你。</p>
                                    <p className="text-[14.5px] text-slate-600 leading-[2]">{mbtiData[resultType].portrait}</p>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mt-7">
                                        <div className="clay-card-soft p-5">
                                            <div className="text-[13px] font-black text-[#2f876a] mb-3 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-[#4fb98c]"></span> 你身上很珍贵的部分
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {mbtiData[resultType].strengths.map(s => (
                                                    <span key={s} className="chip bg-[#e9f9f0] text-[#2f876a]">{s}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="clay-card-soft p-5">
                                            <div className="text-[13px] font-black text-[#b0702c] mb-3 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-[#ef9a44]"></span> 容易被消耗的地方
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {mbtiData[resultType].blindspots.map(s => (
                                                    <span key={s} className="chip bg-[#fff4e3] text-[#a4681f]">{s}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* 建议 */}
                                <section className="clay-card p-6 sm:p-9">
                                    <h3 className="text-[17px] font-black text-slate-800 mb-1">写给 {resultType} 的三条小建议</h3>
                                    <p className="text-[11.5px] text-slate-400 mb-5">不用全做到，挑一条最不别扭的先试试。</p>
                                    <div className="space-y-4">
                                        {mbtiData[resultType].advice.map((a, i) => (
                                            <div key={i} className="advice-item bg-[#fffaf6] rounded-2xl px-4 py-3.5 border border-[#f7ece4]">
                                                <span className="advice-dot"></span>
                                                <p className="text-[13.5px] text-slate-600 leading-relaxed">{a}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                {/* 温暖寄语 */}
                                <section className="quote-card p-7 sm:p-9 relative overflow-hidden">
                                    <div className="absolute right-5 top-3 text-[80px] leading-none font-black text-[#f0c3b4] opacity-30 select-none">”</div>
                                    <h3 className="text-[12px] font-bold tracking-[0.2em] text-[#b78d83] mb-3">给 {resultType} 的你</h3>
                                    <p className="text-[16px] sm:text-[18px] font-bold text-[#8c5b52] leading-[1.9] max-w-3xl">{mbtiData[resultType].warm}</p>
                                    <div className="flex items-center gap-2 mt-4 text-[11.5px] text-[#b78d83] font-semibold">
                                        <Icon name="heart" size={13} color="#e29a8f" />
                                        如果今天只记住一句话，希望是这一段
                                    </div>
                                </section>

                                {/* 职业 情感 */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <section className="clay-card p-6 sm:p-7">
                                        <h3 className="text-[15px] font-black text-slate-800 mb-4 flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "#5a8fd8" }}></span>
                                            更顺手的工作方向
                                        </h3>
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            {mbtiData[resultType].careers.map(c => (
                                                <span key={c} className="chip bg-[#eaf3ff] text-[#35619e]">{c}</span>
                                            ))}
                                        </div>
                                        <p className="text-[12px] text-slate-400 leading-relaxed">这只是「更容易发挥优势」的方向，不是限制。真正决定你去哪的，是你在意什么。</p>
                                    </section>
                                    <section className="clay-card p-6 sm:p-7">
                                        <h3 className="text-[15px] font-black text-slate-800 mb-4 flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ background: "#ef7d7a" }}></span>
                                            亲密关系里的你
                                        </h3>
                                        <p className="text-[13.5px] text-slate-600 leading-[1.9]">{mbtiData[resultType].love}</p>
                                        <div className="mt-4 px-4 py-3 rounded-2xl bg-[#fff5f2] border border-[#ffdfd2] flex items-center justify-between gap-3">
                                            <span className="text-[11.5px] font-bold text-[#a8635a]">常被提到的互补类型</span>
                                            <span className="text-[13px] font-black text-[#d4796f]">{mbtiData[resultType].match}</span>
                                        </div>
                                    </section>
                                </div>

                                <p className="text-center text-[11.5px] text-slate-400 px-6">这份报告是照「典型特征」写的，如果有些地方不像你，那很正常——人本来就比四个字母复杂。</p>
                            </div>
                        )}

                        {/* ===== 图鉴 ===== */}
                        {view === 'encyclopedia' && (
                            <div className="space-y-8 animate-fade-in pb-10">
                                <div className="text-center">
                                    <h1 className="text-[28px] sm:text-[34px] font-black text-slate-800">16 型人格图鉴</h1>
                                    <p className="text-[13px] text-slate-400 mt-2">每个类型都有自己的一张脸，点开看看它的故事</p>
                                </div>
                                {GROUPS.map(group => (
                                    <section key={group.key}>
                                        <div className="flex items-baseline gap-3 mb-4">
                                            <h3 className="text-[18px] font-black text-slate-800">{group.name}</h3>
                                            <span className="text-[11.5px] text-slate-400 font-bold tracking-wide">{group.en}</span>
                                            <span className="hidden sm:inline text-[12px] text-slate-400">{group.desc}</span>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                            {group.types.map(type => (
                                                <button key={type} onClick={() => setSelectedModalType(type)} className="clay-card p-4 tap text-center hover:-translate-y-1 transition bg-white">
                                                    <div className="w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-2"><Mascot type={type} /></div>
                                                    <div className="text-[15px] font-black text-slate-800 leading-tight">{mbtiData[type].name}</div>
                                                    <div className="text-[11px] font-bold text-slate-400 mt-0.5">{type}</div>
                                                    <p className="text-[11px] text-slate-500 mt-2 leading-snug line-clamp-2">{mbtiData[type].summary}</p>
                                                </button>
                                            ))}
                                        </div>
                                    </section>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* ===== 详情弹窗 ===== */}
                    {selectedModalType && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50" onClick={() => setSelectedModalType(null)}>
                            <div className="clay-card max-w-xl w-full p-6 sm:p-8 relative bg-white pop max-h-[88vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedModalType(null)} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center" aria-label="关闭">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M6 6l12 12M18 6l-12 12" /></svg>
                                </button>
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="w-20 h-20 flex-shrink-0"><Mascot type={selectedModalType} /></div>
                                    <div className="min-w-0">
                                        <h3 className="text-[22px] font-black text-slate-800 leading-tight">{mbtiData[selectedModalType].name}</h3>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className={`chip ${GROUPS.find(g => g.key === mbtiData[selectedModalType].group).tint}`}>{mbtiData[selectedModalType].groupName}</span>
                                            <span className="text-[11.5px] text-slate-400 font-bold">{selectedModalType}</span>
                                        </div>
                                    </div>
                                </div>
                                <p className="text-[13.5px] font-bold text-[#d4796f] mb-3">{mbtiData[selectedModalType].slogan}</p>
                                <p className="text-[13px] text-slate-600 leading-[1.95] mb-4">{mbtiData[selectedModalType].portrait}</p>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {mbtiData[selectedModalType].strengths.map(s => <span key={s} className="chip bg-[#f5f0ff] text-[#6b4fa3]">{s}</span>)}
                                </div>
                                <div className="bg-[#fffaf6] border border-[#f7ece4] rounded-2xl p-4 mb-4">
                                    <div className="text-[12px] font-black text-slate-700 mb-2">相处小建议</div>
                                    <p className="text-[13px] text-slate-600 leading-relaxed">{mbtiData[selectedModalType].advice[0]}</p>
                                </div>
                                <div className="flex items-center justify-between text-[12px] bg-[#fff5f2] border border-[#ffdfd2] px-4 py-3 rounded-2xl">
                                    <span className="font-bold text-[#a8635a]">互补类型</span>
                                    <span className="font-black text-[#d4796f]">{mbtiData[selectedModalType].match}</span>
                                </div>
                                <p className="text-[12px] text-[#b78d83] leading-relaxed mt-4">{mbtiData[selectedModalType].warm}</p>
                            </div>
                        </div>
                    )}

                    <footer className="w-full px-4 sm:px-8 pb-8 pt-4">
                        <div className="max-w-6xl mx-auto border-t border-[#efe8ee] pt-5 flex flex-col sm:flex-row gap-2 justify-between items-center text-[11.5px] text-slate-400">
                            <span>本测评为趣味自我了解工具，不具备心理诊断效力。</span>
                            <span className="flex items-center gap-1.5">结果只保存在你的浏览器，不会上传 <Icon name="heart" size={12} color="#e29a8f" /></span>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
